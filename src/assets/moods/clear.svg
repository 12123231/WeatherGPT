<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <radialGradient id="sunGlow" cx="75%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffb703" stop-opacity="0.6" />
      <stop offset="30%" stop-color="#fb8500" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#023047" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0b1320" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2a44" />
      <stop offset="40%" stop-color="#111c2e" />
      <stop offset="80%" stop-color="#0d1522" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>
    <filter id="blurClouds" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
    <linearGradient id="sunBeam" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#ffdda1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fb8500" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#skyGrad)" />
  <rect width="1600" height="900" fill="url(#sunGlow)" />
  <circle cx="1200" cy="180" r="140" fill="#ffe8a3" opacity="0.45" filter="url(#blurClouds)" />
  <polygon points="1200,180 800,900 1100,900" fill="url(#sunBeam)" opacity="0.3" />
  <polygon points="1200,180 1300,900 1550,900" fill="url(#sunBeam)" opacity="0.2" />
  <g filter="url(#blurClouds)" opacity="0.35">
    <ellipse cx="1100" cy="380" rx="350" ry="90" fill="#ffd180" />
    <ellipse cx="850" cy="420" rx="300" ry="70" fill="#fca311" opacity="0.4" />
    <ellipse cx="1350" cy="320" rx="280" ry="80" fill="#ffe8a3" opacity="0.5" />
    <ellipse cx="400" cy="600" rx="400" ry="110" fill="#1e355b" opacity="0.6" />
    <ellipse cx="800" cy="720" rx="600" ry="130" fill="#14213d" opacity="0.7" />
  </g>
  <rect width="1600" height="900" fill="black" opacity="0.35" />
</svg>