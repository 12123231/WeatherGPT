<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="fogSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222731" />
      <stop offset="50%" stop-color="#181b22" />
      <stop offset="100%" stop-color="#0e1014" />
    </linearGradient>
    <filter id="fogFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="50" />
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#fogSky)" />
  <g filter="url(#fogFilter)" opacity="0.45">
    <ellipse cx="800" cy="200" rx="750" ry="90" fill="#64748b" />
    <ellipse cx="500" cy="350" rx="600" ry="110" fill="#475569" />
    <ellipse cx="1100" cy="420" rx="650" ry="120" fill="#55657d" />
    <ellipse cx="700" cy="580" rx="750" ry="130" fill="#334155" />
    <ellipse cx="300" cy="700" rx="550" ry="140" fill="#1e293b" />
    <ellipse cx="1200" cy="740" rx="600" ry="150" fill="#1e293b" />
  </g>
  <rect width="1600" height="900" fill="black" opacity="0.32" />
</svg>