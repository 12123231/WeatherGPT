<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="cloudSky" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#2b313d" />
      <stop offset="45%" stop-color="#1c2027" />
      <stop offset="100%" stop-color="#101216" />
    </linearGradient>
    <filter id="heavyBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="45" />
    </filter>
    <radialGradient id="cloudVolume1" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#475163" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#272d38" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#181b22" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cloudSilver" cx="60%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e242d" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#cloudSky)" />
  <rect width="1600" height="900" fill="url(#cloudSilver)" />
  <g filter="url(#heavyBlur)" opacity="0.55">
    <ellipse cx="800" cy="250" rx="550" ry="140" fill="url(#cloudVolume1)" />
    <ellipse cx="1250" cy="220" rx="450" ry="130" fill="#3f4756" />
    <ellipse cx="350" cy="280" rx="450" ry="130" fill="#2f3642" />
    <ellipse cx="650" cy="460" rx="600" ry="160" fill="#1e232b" />
    <ellipse cx="1200" cy="520" rx="500" ry="150" fill="#181c22" />
    <ellipse cx="200" cy="580" rx="450" ry="160" fill="#13161c" />
    <ellipse cx="800" cy="780" rx="800" ry="180" fill="#0d0e12" />
  </g>
  <rect width="1600" height="900" fill="black" opacity="0.35" />
</svg>